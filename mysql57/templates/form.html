{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('part_list') }}">← Каталог</a><h1>{{ title }}</h1><section class="panel form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% for f in fields %}<div class="field"><label for="{{ f.name }}">{{ f.label }}</label>{% if f.kind in ['select','multiple'] %}<select id="{{ f.name }}" name="{{ f.name }}" {% if f.kind=='multiple' %}multiple{% endif %} {% if f.required %}required{% endif %}>{% if f.kind=='select' %}<option value="">Выберите…</option>{% endif %}{% for value,label in f.choices %}<option value="{{ value }}" {% if (f.kind=='multiple' and value in f.value) or (f.kind=='select' and value|string == f.value|string) %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% elif f.kind=='textarea' %}<textarea id="{{ f.name }}" name="{{ f.name }}" rows="4">{{ f.value }}</textarea>{% elif f.kind=='checkbox' %}<input id="{{ f.name }}" name="{{ f.name }}" type="checkbox" {% if f.value %}checked{% endif %}>{% else %}<input id="{{ f.name }}" name="{{ f.name }}" type="{{ f.kind }}" {% if f.kind!='password' %}value="{{ f.value }}"{% endif %} {% if f.required %}required{% endif %}>{% endif %}</div>{% endfor %}<button class="button">Сохранить</button></form></section>{% endblock %}
