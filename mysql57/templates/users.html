{% extends 'base.html' %}{% block content %}<h1>Пользователи</h1><div class="detail-grid"><section class="panel form-panel"><h2>Создать пользователя</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="username">Логин</label><input id="username" name="username" maxlength="150" required></div><div class="field"><label for="password">Пароль (от 12 символов, буква и цифра)</label><input id="password" name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div><div class="field"><label for="staff">Может редактировать каталог</label><input id="staff" name="staff" type="checkbox"></div><button class="button">Создать</button></form></section><section class="panel detail"><h2>Учётные записи</h2>{% for u in users %}<p><a href="{{ url_for('user_edit',pk=u.id) }}">{{ u.username }}</a> · {{ 'Администратор' if u.admin else 'Сотрудник' if u.staff else 'Просмотр' }} · {{ 'Активен' if u.active else 'Отключён' }}</p>{% endfor %}</section></div>{% endblock %}
